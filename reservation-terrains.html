<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réservation des Terrains</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1a1d23; --sub:#6b7280;
  --border:#e2e4e9; --accent:#2563eb; --accent-text:#fff;
  --free:#eef2ff; --free-hover:#e0e7ff; --taken:#dcfce7; --taken-text:#166534;
  --danger:#dc2626; --swap:#ea580c;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --card:#1e2127; --text:#e5e7eb; --sub:#9ca3af;
    --border:#2c2f36; --accent:#3b82f6; --accent-text:#fff;
    --free:#1e2540; --free-hover:#28305a; --taken:#123023; --taken-text:#4ade80;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --card:#1e2127; --text:#e5e7eb; --sub:#9ca3af;
  --border:#2c2f36; --accent:#3b82f6; --accent-text:#fff;
  --free:#1e2540; --free-hover:#28305a; --taken:#123023; --taken-text:#4ade80;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.25rem;margin:6px 0 2px}
.sub{color:var(--sub);font-size:.85rem;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
label{font-size:.8rem;color:var(--sub);display:block;margin-bottom:4px}
input[type=date]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem}
.daynav{display:flex;gap:8px;margin-top:10px}
.daynav button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:.85rem}
.grid-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--border)}
table{border-collapse:collapse;width:100%;min-width:520px;background:var(--card)}
th,td{padding:6px;text-align:center;font-size:.78rem;border-bottom:1px solid var(--border)}
th{background:var(--bg);color:var(--sub);font-weight:600;position:sticky;top:0}
td.hour{color:var(--sub);white-space:nowrap;font-weight:600}
.slot{border-radius:9px;padding:8px 4px;cursor:pointer;user-select:none;min-height:38px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.slot.free{background:var(--free)}
.slot.free:hover{background:var(--free-hover)}
.slot.taken{background:var(--taken);color:var(--taken-text);font-weight:600}
.slot.selected{outline:2px solid var(--swap)}
.slot small{font-weight:400;opacity:.75;font-size:.68rem}
.actions{display:flex;gap:4px;justify-content:center;margin-top:3px}
.actions button{border:none;border-radius:6px;padding:2px 6px;font-size:.68rem;cursor:pointer;color:#fff}
.btn-cancel{background:var(--danger)}
.btn-swap{background:var(--swap)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--sub);margin-top:10px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.banner{background:var(--free);border:1px solid var(--accent);border-radius:10px;padding:8px 10px;font-size:.8rem;margin-bottom:12px;display:none}
.outofrange{color:var(--danger);font-size:.85rem;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏟️ Réservation des Terrains</h1>
  <div class="sub">Mini-foot • Basketball • Volleyball — créneaux de 8h à 22h, année scolaire 2026–2027</div>

  <div class="card">
    <label for="datePick">Choisir une date</label>
    <input type="date" id="datePick" min="2026-09-01" max="2027-06-30">
    <div class="daynav">
      <button id="prevDay">← Veille</button>
      <button id="today">Aujourd'hui</button>
      <button id="nextDay">Lendemain →</button>
    </div>
    <div id="outOfRange" class="outofrange"></div>
  </div>

  <div id="swapBanner" class="banner">Mode échange : cliquez sur un 2ᵉ créneau réservé pour échanger les deux groupes. <span id="cancelSwap" style="cursor:pointer;text-decoration:underline">Annuler</span></div>

  <div class="grid-wrap">
    <table id="grid">
      <thead><tr><th>Heure</th><th>Mini-foot</th><th>Basketball</th><th>Volleyball</th></tr></thead>
      <tbody id="gridBody"></tbody>
    </table>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:var(--free)"></span>Libre</span>
    <span><span class="dot" style="background:var(--taken)"></span>Réservé</span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// >>> REMPLACE ces valeurs par ta propre config Firebase (étape "Récupérer la configuration web") <<<
const firebaseConfig = {
  apiKey: "AIzaSyAtUTqkXD6AzFX_ZDVmUJ91vl7vsmI8zKM",
  authDomain: "drmec-reservation-terrains.firebaseapp.com",
  projectId: "drmec-reservation-terrains",
  storageBucket: "drmec-reservation-terrains.firebasestorage.app",
  messagingSenderId: "1036398595333",
  appId: "1:1036398595333:web:c62136e6e77aa965057b6c"
};
const app = initializeApp(firebaseConfig);
const dbFire = getFirestore(app);
const resCol = collection(dbFire, "reservations");

const COURTS=["minifoot","basket","volley"];
const COURT_LABELS={minifoot:"Mini-foot",basket:"Basketball",volley:"Volleyball"};
const START_HOUR=8, END_HOUR=22;
const MIN_DATE="2026-09-01", MAX_DATE="2027-06-30";

let data = {}; // populated live from Firestore, key -> nom de l'étudiant

// Real-time sync: any change (this device or any other) re-renders everyone
onSnapshot(resCol, (snap)=>{
  data = {};
  snap.forEach(d=>{ data[d.id] = d.data().nom; });
  render();
}, (err)=>{ console.error("Firestore error", err); });

async function reserve(k, nom){ await setDoc(doc(dbFire, "reservations", k), { nom, ts: Date.now() }); }
async function cancel(k){ await deleteDoc(doc(dbFire, "reservations", k)); }
async function swap(k1, k2, nom1, nom2){
  const batch = writeBatch(dbFire);
  batch.set(doc(dbFire, "reservations", k1), { nom: nom2, ts: Date.now() });
  batch.set(doc(dbFire, "reservations", k2), { nom: nom1, ts: Date.now() });
  await batch.commit();
}

const dateInput = document.getElementById('datePick');
const today = new Date();
dateInput.value = today.toISOString().slice(0,10) < MIN_DATE ? MIN_DATE :
                  (today.toISOString().slice(0,10) > MAX_DATE ? MAX_DATE : today.toISOString().slice(0,10));

let swapMode = null; // {date,court,hour} of first selected slot
const swapBanner = document.getElementById('swapBanner');
document.getElementById('cancelSwap').onclick = ()=>{ swapMode=null; swapBanner.style.display='none'; render(); };

function key(date,court,hour){ return date+'_'+court+'_'+hour; }

function render(){
  const date = dateInput.value;
  const outOfRange = document.getElementById('outOfRange');
  if(date < MIN_DATE || date > MAX_DATE){
    outOfRange.textContent = "Cette date est en dehors de l'année scolaire (01/09/2026 – 30/06/2027).";
  } else {
    outOfRange.textContent = "";
  }
  const body = document.getElementById('gridBody');
  body.innerHTML = '';
  for(let h=START_HOUR; h<END_HOUR; h++){
    const tr = document.createElement('tr');
    const tdHour = document.createElement('td');
    tdHour.className='hour';
    tdHour.textContent = h+"h–"+(h+1)+"h";
    tr.appendChild(tdHour);
    COURTS.forEach(court=>{
      const td = document.createElement('td');
      const k = key(date,court,h);
      const group = data[k];
      const div = document.createElement('div');
      div.className = 'slot ' + (group ? 'taken' : 'free');
      if(swapMode && swapMode.date===date && swapMode.court===court && swapMode.hour===h){
        div.classList.add('selected');
      }
      if(group){
        div.innerHTML = '<div>'+escapeHtml(group)+'</div><div class="actions"><button class="btn-cancel">Annuler</button><button class="btn-swap">Échanger</button></div>';
        div.querySelector('.btn-cancel').onclick = (e)=>{ e.stopPropagation(); cancel(k); };
        div.querySelector('.btn-swap').onclick = (e)=>{
          e.stopPropagation();
          if(swapMode && (swapMode.date!==date||swapMode.court!==court||swapMode.hour!==h)){
            const k2 = key(swapMode.date,swapMode.court,swapMode.hour);
            swap(k, k2, data[k], data[k2]);
            swapMode=null; swapBanner.style.display='none';
          } else {
            swapMode = {date,court,hour:h};
            swapBanner.style.display='block';
            render();
          }
        };
      } else {
        div.onclick = ()=>{
          const nom = prompt("Votre nom (pour réserver "+COURT_LABELS[court]+", "+h+"h-"+(h+1)+"h) :");
          if(nom && nom.trim()){ reserve(k, nom.trim()); }
        };
      }
      td.appendChild(div);
      tr.appendChild(td);
    });
    body.appendChild(tr);
  }
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

dateInput.addEventListener('change', render);
document.getElementById('prevDay').onclick = ()=>{ dateInput.value = shiftDate(dateInput.value,-1); render(); };
document.getElementById('nextDay').onclick = ()=>{ dateInput.value = shiftDate(dateInput.value,1); render(); };
document.getElementById('today').onclick = ()=>{ dateInput.value = new Date().toISOString().slice(0,10); render(); };
function shiftDate(str,delta){ const d=new Date(str+'T00:00:00'); d.setDate(d.getDate()+delta); return d.toISOString().slice(0,10); }

render();
</script>
</body>
</html>
